name: Deploy static content to Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write    # required-by-design: publish the prepared artifact to GitHub Pages
      id-token: write # required-by-design: GitHub Pages deployment uses OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Stage only the files that make up the public site into a dedicated
      # publish directory.  Uploading repo root previously included target/,
      # crates/, .git/, etc. and exceeded the artifact size budget.
      - name: Stage publish directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_publish
          cp index.html _pages_publish/
          # CNAME and .nojekyll are required at site root for custom domain
          # + raw HTML serving (no Jekyll preprocessing).
          if [ -f CNAME ];    then cp CNAME    _pages_publish/; fi
          if [ -f .nojekyll ]; then cp .nojekyll _pages_publish/; fi

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _pages_publish
          # v4.0.0 of this action excluded dotfiles by default.  .nojekyll must
          # ship so GitHub Pages serves the raw HTML and skips Jekyll.
          include-hidden-files: 'true'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
