name: registry-watch
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions: read-all
jobs:
  registry-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Janitor Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo janitor-security/the-janitor --json tagName -q .tagName)"
          mkdir -p /tmp/janitor-bin
          gh release download "${TAG}" \
            --repo janitor-security/the-janitor \
            --pattern "janitor" \
            --pattern "janitor.sha384" \
            --dir /tmp/janitor-bin \
            --clobber
          printf '%s  %s\n' "$(tr -d '\n' < /tmp/janitor-bin/janitor.sha384)" "/tmp/janitor-bin/janitor" | sha384sum -c -
          chmod +x /tmp/janitor-bin/janitor
          echo "/tmp/janitor-bin" >> "$GITHUB_PATH"

      - name: Run registry watch scan
        id: scan
        run: |
          set -euo pipefail
          # Correct subcommand: watch-registries (not registry-watch).
          # --once: single poll cycle, no daemon loop.
          # --dry-run: print findings as NDJSON to stdout; do NOT write queue file.
          # Findings detection: non-empty output file, not exit code.
          # Exit code is always 0 on success; non-zero only on binary/network error.
          janitor watch-registries --once --dry-run --max-age-hours 24 > /tmp/rw_report.json 2>/tmp/rw_scan.log || {
            echo "::warning::watch-registries exited non-zero — check /tmp/rw_scan.log for errors (not a findings signal)"
            echo "findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -s /tmp/rw_report.json ]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            # Generate minimal SARIF from NDJSON for Security tab integration.
            jq -n --slurpfile pkgs /tmp/rw_report.json '{
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              version: "2.1.0",
              runs: [{
                tool: { driver: { name: "janitor-registry-watch", version: "1.0", rules: [] } },
                results: [ $pkgs[] | {
                  ruleId: "registry-watch/suspicious-package",
                  level: "warning",
                  message: { text: ("Suspicious package: " + .name + " v" + .version + " (" + .registry + ")") },
                  locations: [{ physicalLocation: { artifactLocation: { uri: "registry-feed" } } }]
                }]
              }]
            }' > /tmp/rw_report.sarif
          else
            echo "findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to Security tab
        if: always() && hashFiles('/tmp/rw_report.sarif') != ''
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b # v3
        with:
          sarif_file: /tmp/rw_report.sarif

      - name: Upload report artifact
        if: always() && hashFiles('/tmp/rw_report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rw-report-${{ github.run_id }}
          path: /tmp/rw_report.json
          retention-days: 30

      - name: File issue on detection
        if: steps.scan.outputs.findings == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Registry Watch: suspicious package detected',
              body: [
                '## Registry Watch Alert',
                '',
                `Automated registry scan on run [${context.runId}](${runUrl}) detected suspicious packages.`,
                '',
                '**Artifacts:** Download `rw-report-' + context.runId + '` from the run artifacts above for the full NDJSON report.',
                '',
                '**SARIF findings** are visible in the [Security → Code scanning](../../security/code-scanning) tab.',
                '',
                'Triage: review the artifact, verify each package is a true positive, then close this issue with a resolution comment.'
              ].join('\n')
            })
