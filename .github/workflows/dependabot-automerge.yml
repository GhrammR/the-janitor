name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main

# Minimal workflow surface: read by default; the dependabot job receives only
# PR-write + contents-write authority. contents:write is required by both
# enablePullRequestAutoMerge (gh pr merge --auto) and updatePullRequestBranch
# (gh pr update-branch) GraphQL mutations.
permissions:
  contents: read

jobs:
  auto-merge:
    name: dependabot-automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Hard-guard: only act when the PR author is the Dependabot bot.
    # github.actor is set by GitHub and cannot be spoofed by PR content.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # Update the branch so it is current with main before arming auto-merge.
      # Branch protection runs strict:false, so this is a hygiene step only;
      # the merge is not blocked if the branch is slightly behind main.
      - name: Update branch to base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr update-branch \
            --repo "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}" || true

      # Enable auto-merge. Fires the moment all required checks pass on the
      # updated branch.
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash \
            --repo "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"
