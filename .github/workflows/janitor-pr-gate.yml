name: Janitor PR Gate

on:
  pull_request:
    branches:
      - main

# Workflow-level: deny all by default.
permissions:
  contents: read

jobs:
  slop-gate:
    name: Structural Firewall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      # Workspace-owned path, parity with janitor.yml.  Avoids the
      # `~/.cache/sccache/preprocessor: Permission denied (os error 13)`
      # crash when a prior step left a $HOME cache dir owned by another uid.
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
    # Job-level: read PR diff + write step summary.
    # statuses:write is required for local-only mode to post the bounce
    # verdict as a named commit status when no Governor URL is configured.
    # security-events:write is required for the SARIF upload step.
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCCACHE_DIR"

      - name: Restore sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: ${{ runner.os }}-sccache-janitor-pr-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-janitor-pr-

      - name: Set up Janitor toolchain
        uses: ./.github/actions/toolchain-setup

      - name: Formal toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/toolchain-preflight.sh

      # Dogfooding: run the composite action from the current branch so every
      # PR to this repo is itself gated by the version of the action it carries.
      - name: Janitor slop gate
        id: janitor
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          governor_url: ${{ secrets.JANITOR_GOVERNOR_URL }}

      - name: Upload bounce log
        # Always upload so reviewers can inspect findings even on gate failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janitor-bounce-log-pr-${{ github.event.pull_request.number }}
          path: .janitor/bounce_log.ndjson
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .janitor/janitor-results.sarif
          category: janitor
        continue-on-error: true

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
