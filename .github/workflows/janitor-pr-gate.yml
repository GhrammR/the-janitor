name: Janitor PR Gate

on:
  pull_request:
    branches:
      - main

# Workflow-level: deny all by default.
permissions:
  contents: read

jobs:
  slop-gate:
    name: Structural Firewall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      # Workspace-owned path, parity with janitor.yml.  Avoids the
      # `~/.cache/sccache/preprocessor: Permission denied (os error 13)`
      # crash when a prior step left a $HOME cache dir owned by another uid.
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
    # Job-level: read PR diff + write step summary.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCCACHE_DIR"

      - name: Restore sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: ${{ runner.os }}-sccache-janitor-pr-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-janitor-pr-

      # P4-11: Install Kani formal verifier. Missing proof tooling is a hard
      # preflight failure; agents must not silently downgrade assurance.
      - name: Install Kani Verifier
        shell: bash
        run: |
          set -euo pipefail
          if cargo install --locked kani-verifier 2>/dev/null && cargo kani setup 2>/dev/null; then
            echo "✅ Kani verifier installed."
          else
            echo "Kani installation failed. Remediation: cargo install --locked kani-verifier && cargo kani setup" >&2
            exit 1
          fi
        timeout-minutes: 5

      - name: Install durable Z3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${HOME}/.local/share/janitor-tools/z3-venv"
          "${HOME}/.local/share/janitor-tools/z3-venv/bin/python" -m pip install --upgrade pip z3-solver
          mkdir -p "${HOME}/.local/bin"
          ln -sf "${HOME}/.local/share/janitor-tools/z3-venv/bin/z3" "${HOME}/.local/bin/z3"

      - name: Formal toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/toolchain-preflight.sh

      # Dogfooding: run the composite action from the current branch so every
      # PR to this repo is itself gated by the version of the action it carries.
      - name: Janitor slop gate
        id: janitor
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          governor_url: ${{ secrets.JANITOR_GOVERNOR_URL }}

      - name: Upload bounce log
        # Always upload so reviewers can inspect findings even on gate failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janitor-bounce-log-pr-${{ github.event.pull_request.number }}
          path: .janitor/bounce_log.ndjson
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
