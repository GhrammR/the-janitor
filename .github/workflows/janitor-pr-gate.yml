name: Janitor PR Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: >
          PR number to gate (manual re-trigger when the pull_request.opened
          event is dropped by GitHub Actions — e.g. after a Governor
          Janitor Integrity Check timed_out with no gate run recorded).
        required: true
        type: number

# Workflow-level: deny all by default.
permissions:
  contents: read

jobs:
  slop-gate:
    name: Structural Firewall
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      # Workspace-owned path, parity with janitor.yml.  Avoids the
      # `~/.cache/sccache/preprocessor: Permission denied (os error 13)`
      # crash when a prior step left a $HOME cache dir owned by another uid.
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
    # Job-level: read PR diff + write step summary. The downstream
    # `integrity-check` job publishes the required Janitor Integrity Check as a
    # native Actions check, so no commit-status write permission is needed.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCCACHE_DIR"

      - name: Restore sccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: ${{ runner.os }}-sccache-janitor-pr-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sccache-janitor-pr-

      - name: Set up Janitor toolchain
        uses: ./.github/actions/toolchain-setup

      - name: Formal toolchain preflight
        shell: bash
        run: |
          set -euo pipefail
          ./tools/toolchain-preflight.sh

      # Dogfooding: run the composite action from the current branch so every
      # PR to this repo is itself gated by the version of the action it carries.
      - name: Janitor slop gate
        id: janitor
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          governor_url: ${{ secrets.JANITOR_GOVERNOR_URL }}
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}

      - name: Upload bounce log
        # Always upload so reviewers can inspect findings even on gate failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: janitor-bounce-log-pr-${{ github.event.pull_request.number }}
          path: .janitor/bounce_log.ndjson
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: .janitor/janitor-results.sarif
          category: janitor
        continue-on-error: true

      - name: Generate dependency snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps 2>/dev/null \
            | jq '{schema: "dep-snapshot/v1", generated: "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'", packages: [.packages[] | {name, version, source}]}' \
            > /tmp/pr_sbom.cdx.json || true

      - name: Upload SBOM artifact
        if: always() && hashFiles('/tmp/pr_sbom.cdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-pr-snapshot-${{ github.event.pull_request.number }}
          path: /tmp/pr_sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  integrity-check:
    name: Janitor Integrity Check
    runs-on: ubuntu-latest
    needs: slop-gate
    if: always()
    permissions:
      contents: read
    steps:
      - name: Mirror structural gate result
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.slop-gate.result }}" != "success" ]; then
            echo "Structural Firewall result: ${{ needs.slop-gate.result }}"
            exit 1
          fi
          echo "Structural Firewall passed."
