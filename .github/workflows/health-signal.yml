name: Systems Health Signal Monitor

# Watches mission-critical workflows and opens an auto-closing tracking issue
# when a workflow fails for >= THRESHOLD consecutive runs.  De-duplicates by
# label so a single open issue tracks any one workflow's outage; auto-comments
# and closes when the workflow returns a success run.
#
# Tuning / disabling: docs/health-signal-monitor.md

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    # Subset of workflows whose continued failure is operationally significant.
    # Add a workflow's display name (the `name:` field, NOT the file path) to
    # extend coverage.
    workflows:
      - "CISA KEV Weekly Sync"
      - "CodeQL"
      - "OpenSSF Scorecard"
      - "MSRV Sync"
      - "Janitor Self-Audit"
    types: [completed]

# Workflow-level: deny by default.
permissions:
  contents: read

jobs:
  monitor:
    name: Health Signal Monitor
    runs-on: ubuntu-latest
    # Job-level: read run history + manage issues.  No write access to source.
    permissions:
      contents: read
      issues: write # required-by-design: open/comment/close the deduplicated outage tracker
      actions: read # required-by-design: inspect recent workflow conclusions for dedupe
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Evaluate consecutive failures and act
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Open a tracking issue when this many recent runs in a row fail.
          THRESHOLD: '2'
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow.name || 'Scheduled Systems Health Sweep' }}
          WORKFLOW_PATH: ${{ github.event.workflow.path || '.github/workflows/health-signal.yml' }}
          LATEST_RUN_URL: ${{ github.event.workflow_run.html_url || github.server_url }}
          LATEST_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'scheduled' }}
        shell: bash
        run: |
          set -euo pipefail

          # Sanitize the workflow name into a stable, lowercase, slug-safe label.
          LABEL_SLUG="$(printf '%s' "${WORKFLOW_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr -c 'a-z0-9-' '-' \
            | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          LABEL="health-signal/${LABEL_SLUG}"

          echo "[health-signal] workflow='${WORKFLOW_NAME}' path='${WORKFLOW_PATH}'"
          echo "[health-signal] latest_conclusion='${LATEST_RUN_CONCLUSION}'"
          echo "[health-signal] threshold=${THRESHOLD} label='${LABEL}'"

          # Idempotently ensure the dedup label exists.  `gh label create` returns
          # exit 1 when the label already exists; tolerate that.
          gh label create "${LABEL}" \
            --repo "${REPO}" \
            --color "B60205" \
            --description "Auto-managed by health-signal monitor — ${WORKFLOW_NAME}" \
            2>/dev/null || true

          # Fetch the last (THRESHOLD + 2) completed runs of this workflow so we
          # can determine consecutive-failure depth without ambiguity.
          # `--repo` is mandatory: this job does not check out source, so gh has
          # no git context to auto-detect the repository from.
          LIMIT=$((THRESHOLD + 2))
          # Guard: gh run list returns exit 1 for GitHub-hosted or dynamic
          # workflow paths (e.g. "dynamic/github-code-scanning/codeql").
          # Fall back to "[]" so the null-guard below fires cleanly.
          RUNS_JSON=$(gh run list \
            --repo "${REPO}" \
            --workflow="${WORKFLOW_PATH}" \
            --status=completed \
            --limit="${LIMIT}" \
            --json conclusion,databaseId,createdAt \
            --jq '.' 2>/dev/null || echo '[]')
          if [ -z "${RUNS_JSON}" ] || [ "${RUNS_JSON}" = "[]" ]; then
            echo "[health-signal] no completed runs visible — exiting cleanly"
            exit 0
          fi

          # Look up any open tracking issue for this workflow.
          ISSUE_NUM="$(gh issue list \
            --repo "${REPO}" \
            --label "${LABEL}" \
            --state open \
            --json number \
            --jq '.[0].number // empty' 2>/dev/null || echo '')"

          MOST_RECENT_CONCLUSION="$(printf '%s' "${RUNS_JSON}" | jq -r '.[0].conclusion // empty')"

          # ── Recovery path: most recent run succeeded; close any open tracker.
          if [ "${MOST_RECENT_CONCLUSION}" = "success" ]; then
            if [ -n "${ISSUE_NUM}" ]; then
              gh issue comment "${ISSUE_NUM}" \
                --repo "${REPO}" \
                --body "Workflow **${WORKFLOW_NAME}** has recovered. Latest success: ${LATEST_RUN_URL}"
              gh issue close "${ISSUE_NUM}" --repo "${REPO}"
              echo "[health-signal] closed recovery issue #${ISSUE_NUM}"
            else
              echo "[health-signal] no-op (latest run succeeded, no open tracker)"
            fi
            exit 0
          fi

          # ── Failure path: count consecutive failures from the head of the list.
          CONSEC="$(printf '%s' "${RUNS_JSON}" \
            | jq '[.[] | .conclusion] | (index("success") // length)')"
          echo "[health-signal] consecutive_failures=${CONSEC}"

          if [ "${CONSEC}" -lt "${THRESHOLD}" ]; then
            echo "[health-signal] below threshold (${CONSEC} < ${THRESHOLD}) — exiting"
            exit 0
          fi

          # Either open a new tracker or comment on the existing one.
          if [ -n "${ISSUE_NUM}" ]; then
            gh issue comment "${ISSUE_NUM}" \
              --repo "${REPO}" \
              --body "Still failing — ${CONSEC} consecutive failures. Latest run: ${LATEST_RUN_URL}"
            echo "[health-signal] appended failure comment to issue #${ISSUE_NUM}"
          else
            BODY="Workflow **${WORKFLOW_NAME}** has failed ${CONSEC} times in a row.

          | Field | Value |
          | --- | --- |
          | Workflow path | \`${WORKFLOW_PATH}\` |
          | Latest failed run | ${LATEST_RUN_URL} |
          | Threshold | ${THRESHOLD} consecutive failures |
          | Auto-close | When the workflow next returns a \`success\` conclusion |

          This issue is auto-managed by \`.github/workflows/health-signal.yml\`.
          To tune the threshold, list of monitored workflows, or disable the
          monitor, see \`docs/health-signal-monitor.md\`."
            gh issue create \
              --repo "${REPO}" \
              --title "[health-signal] ${WORKFLOW_NAME} failing for ${CONSEC} consecutive runs" \
              --body "${BODY}" \
              --label "${LABEL}"
          echo "[health-signal] opened new tracker for ${WORKFLOW_NAME}"
          fi

      - name: Build ranked operational issue queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STUCK_MINUTES: "45"
          STALE_DAYS: "7"
        shell: bash
        run: |
          set -euo pipefail

          QUEUE="$(mktemp)"
          printf '| Rank | Issue | Remediation command |\n| --- | --- | --- |\n' > "${QUEUE}"

          add_issue() {
            printf "| %s | %s | \`%s\` |\n" "$1" "$2" "$3" >> "${QUEUE}"
          }

          now_epoch="$(date -u +%s)"
          stuck_cutoff=$((now_epoch - STUCK_MINUTES * 60))
          stale_cutoff=$((now_epoch - STALE_DAYS * 86400))

          # Guard: API call may fail on rate-limit or transient network error.
          pr_json="$(gh pr list --repo "${REPO}" --state open --limit 50 \
            --json number,title,updatedAt,statusCheckRollup,url 2>/dev/null || echo '[]')"

          # shellcheck disable=SC2016 # jq variables are intentionally evaluated by jq, not Bash.
          printf '%s' "${pr_json}" \
            | jq -r '.[] as $pr
              | $pr.statusCheckRollup[]?
              | select(.__typename == "CheckRun" and .status == "IN_PROGRESS")
              | [$pr.number, .name, .startedAt, .detailsUrl] | @tsv' \
            | while IFS=$'\t' read -r pr_number check_name started_at details_url; do
                [ -n "${started_at}" ] || continue
                started_epoch="$(date -u -d "${started_at}" +%s 2>/dev/null || echo "${now_epoch}")"
                if [ "${started_epoch}" -lt "${stuck_cutoff}" ]; then
                  add_issue "P0" "Stuck check '${check_name}' on PR #${pr_number}: ${details_url}" \
                    "gh pr checks ${pr_number} --repo ${REPO}"
                fi
              done

          # shellcheck disable=SC2016 # jq filter is single-quoted to protect jq syntax from Bash.
          printf '%s' "${pr_json}" \
            | jq -r '.[] | [.number, .updatedAt, .url] | @tsv' \
            | while IFS=$'\t' read -r pr_number updated_at pr_url; do
                updated_epoch="$(date -u -d "${updated_at}" +%s 2>/dev/null || echo "${now_epoch}")"
                if [ "${updated_epoch}" -lt "${stale_cutoff}" ]; then
                  add_issue "P2" "Stale open PR #${pr_number}: ${pr_url}" \
                    "gh pr view ${pr_number} --repo ${REPO} --json statusCheckRollup,mergeStateStatus"
                fi
              done

          if ! cargo kani --version >/dev/null 2>&1; then
            add_issue "P1" "Kani verifier is unavailable in the runner." \
              "cargo install --locked kani-verifier && cargo kani setup"
          fi

          if ! command -v z3 >/dev/null 2>&1; then
            add_issue "P2" "Z3 CLI is unavailable in the runner; formal proof translation has reduced assurance." \
              "python3 -m venv ${HOME}/.local/share/janitor-tools/z3-venv && ${HOME}/.local/share/janitor-tools/z3-venv/bin/python -m pip install --upgrade pip z3-solver && ln -sf ${HOME}/.local/share/janitor-tools/z3-venv/bin/z3 ${HOME}/.local/bin/z3"
          fi

          if ! command -v shellcheck >/dev/null 2>&1; then
            add_issue "P2" "ShellCheck is unavailable; workflow lint assurance is reduced." \
              "install ShellCheck 0.10.0 or newer into ${HOME}/.local/bin/shellcheck"
          fi

          if ! curl -fsSI https://thejanitor.app/security/ >/dev/null; then
            add_issue "P0" "Docs deployment drift: /security/ is not externally reachable." \
              "just deploy-docs"
          fi

          if curl -fsSI https://thejanitor.app/grant_strategy/ >/dev/null; then
            add_issue "P1" "Internal grant strategy page is still publicly reachable." \
              "mkdocs build --strict && just deploy-docs"
          fi

          # shellcheck disable=SC2016 # jq interpolation belongs to gh --jq, not Bash.
          failures="$(gh run list --repo "${REPO}" --status failure --limit 10 \
            --json workflowName,url,createdAt \
            --jq '.[] | "\(.workflowName)\t\(.url)\t\(.createdAt)"' || true)"
          if [ -n "${failures}" ]; then
            printf '%s\n' "${failures}" \
              | while IFS=$'\t' read -r workflow url created_at; do
                  add_issue "P2" "Recent workflow failure in ${workflow} at ${created_at}: ${url}" \
                    "gh run view ${url##*/} --repo ${REPO} --log-failed"
                done
          fi

          if [ "$(wc -l < "${QUEUE}")" -le 2 ]; then
            printf 'No active health anomaly detected.\n' >> "${GITHUB_STEP_SUMMARY}"
            echo "[health-signal] no ranked operational issues"
          else
            {
              printf '## Ranked Systems Health Issue Queue\n\n'
              cat "${QUEUE}"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "[health-signal] ranked operational issues detected"
            cat "${QUEUE}"
          fi
