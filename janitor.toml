min_slop_score = 10

[forge]
# Sprint 169-170 oracle and detector files contain intentionally repetitive
# boolean-predicate functions (is_exploitable, is_reachable, is_critical, etc.)
# that are structurally identical after alpha-normalization.  Each predicate
# corresponds to one proof obligation and must follow the same boolean-conjunction
# contract for Kani formal verification and oracle evaluation consistency.
# These are deliberate by design — not accidental copy-paste.
clone_exempt_paths = [
  "crates/cli/src/registry_watch_cmd.rs",
  "crates/forge/src/binary_diff.rs",
  "crates/forge/src/callgraph.rs",
  "crates/forge/src/compliance_oracle.rs",
  "crates/forge/src/medical.rs",
  "crates/forge/src/proof_obligation.rs",
  "crates/forge/src/registry_probe.rs",
  "crates/forge/src/registry_watch/crates_io.rs",
  "crates/forge/src/registry_watch/queue.rs",
  "crates/forge/src/registry_watch/score.rs",
  "crates/forge/src/threat_model_oracle.rs",
]
